<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="白事一条龙">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>白事一条龙 - 下单系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0ebe3;
    color: #333;
    min-height: 100vh;
  }

  /* ========== Header ========== */
  .header {
    background: linear-gradient(135deg, #1a1a1a 0%, #2c2c2c 100%);
    color: #fff;
    padding: 24px 0;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .header h1 {
    font-size: 32px;
    letter-spacing: 4px;
    font-weight: 400;
  }
  .header .sub {
    margin-top: 6px;
    font-size: 14px;
    color: #999;
    letter-spacing: 2px;
  }

  /* ========== Layout ========== */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    gap: 24px;
  }

  /* ========== Product Panel ========== */
  .product-panel {
    flex: 1;
  }
  .product-panel h2 {
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid #1a1a1a;
    letter-spacing: 2px;
  }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .product-card {
    background: #fff;
    border: 1px solid #ddd;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .product-card:hover {
    border-color: #1a1a1a;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    transform: translateY(-2px);
  }
  .product-card .icon {
    font-size: 40px;
    margin-bottom: 10px;
  }
  .product-card .name {
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .product-card .price {
    font-size: 20px;
    color: #8b0000;
    font-weight: bold;
  }
  .product-card .unit {
    font-size: 12px;
    color: #999;
  }
  .product-card.needs-remark::after {
    content: "需备注";
    position: absolute;
    top: 8px;
    right: -26px;
    background: #8b0000;
    color: #fff;
    font-size: 11px;
    padding: 2px 26px;
    transform: rotate(45deg);
  }

  /* ========== Cart Panel ========== */
  .cart-panel {
    width: 400px;
    flex-shrink: 0;
    background: #fff;
    border: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 160px);
    position: sticky;
    top: 24px;
  }
  .cart-panel h2 {
    font-size: 18px;
    font-weight: 400;
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    letter-spacing: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cart-panel h2 .count {
    font-size: 13px;
    color: #999;
    letter-spacing: 0;
  }
  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }
  .cart-empty {
    text-align: center;
    color: #bbb;
    padding: 60px 0;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .cart-item {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f5f5f5;
    gap: 12px;
    position: relative;
  }
  .cart-item .item-info { flex: 1; }
  .cart-item .item-name { font-size: 15px; letter-spacing: 1px; }
  .cart-item .item-remark {
    font-size: 12px;
    color: #8b0000;
    margin-top: 2px;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cart-item .item-price { color: #999; font-size: 13px; }

  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qty-ctrl button {
    width: 28px;
    height: 28px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: all 0.15s;
  }
  .qty-ctrl button:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .qty-ctrl .qty { min-width: 20px; text-align: center; font-size: 15px; }

  .cart-item .btn-del {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
  }
  .cart-item .btn-del:hover { color: #8b0000; }

  /* ========== Cart Footer ========== */
  .cart-footer {
    border-top: 1px solid #eee;
    padding: 16px 20px;
  }
  .cart-footer .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .cart-footer .total .num { color: #8b0000; font-weight: bold; font-size: 24px; }
  .btn-order {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    letter-spacing: 3px;
    border: none;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-order:hover { background: #8b0000; }
  .btn-order:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  /* ========== Modal ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: #fff;
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    font-size: 17px;
    letter-spacing: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header .btn-close {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #999;
    padding: 0 4px;
    line-height: 1;
  }
  .modal-header .btn-close:hover { color: #333; }
  .modal-body { padding: 20px; }
  .modal-body .product-info {
    background: #f9f9f9;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 15px;
    letter-spacing: 1px;
    text-align: center;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    letter-spacing: 1px;
    color: #555;
  }
  .form-group label .required { color: #8b0000; margin-left: 2px; }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #1a1a1a;
  }
  .modal-footer {
    display: flex;
    gap: 12px;
    padding: 0 20px 20px;
  }
  .modal-footer button {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
    transition: all 0.2s;
  }
  .modal-footer button:hover { border-color: #1a1a1a; }
  .modal-footer button.btn-primary {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }
  .modal-footer button.btn-primary:hover { background: #8b0000; border-color: #8b0000; }

  /* ========== Order Confirm Modal ========== */
  .order-summary {
    background: #f9f9f9;
    padding: 16px;
    margin-bottom: 16px;
  }
  .order-summary table {
    width: 100%;
    border-collapse: collapse;
  }
  .order-summary td, .order-summary th {
    padding: 8px 6px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .order-summary th { text-align: left; font-weight: 400; color: #999; }
  .order-summary .remark-cell { color: #8b0000; font-size: 12px; }
  .order-summary .total-row td {
    font-weight: bold;
    font-size: 18px;
    border-bottom: none;
    padding-top: 12px;
  }
  .badge-remark {
    display: inline-block;
    font-size: 11px;
    background: #8b0000;
    color: #fff;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* ========== Success Toast ========== */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    padding: 12px 32px;
    letter-spacing: 2px;
    font-size: 15px;
    z-index: 2000;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  @keyframes toastIn { from { opacity: 0; top: 0; } to { opacity: 1; top: 24px; } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* ========== Mobile Styles ========== */
  @media (max-width: 768px) {
    .header h1 { font-size: 22px; letter-spacing: 2px; }
    .header .sub { font-size: 12px; }
    .container {
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }
    .product-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .product-card { padding: 14px 10px; }
    .product-card .icon { font-size: 30px; margin-bottom: 6px; }
    .product-card .name { font-size: 14px; }
    .product-card .price { font-size: 17px; }
    .product-card.needs-remark::after {
      font-size: 10px;
      top: 6px;
      right: -28px;
      padding: 1px 28px;
    }

    .cart-panel {
      width: 100%;
      max-height: none;
      position: static;
    }
    .cart-item .item-remark { max-width: 120px; }

    .modal {
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 0;
    }
    .btn-order {
      padding: 14px;
      font-size: 18px;
    }
  }

  @media (max-width: 400px) {
    .product-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .product-card { padding: 10px 6px; }
    .product-card .name { font-size: 13px; }
    .product-card .price { font-size: 15px; }
  }

  /* ========== Print Styles ========== */
  @media print {
    body { background: #fff; }
    .header { background: #000 !important; -webkit-print-color-adjust: exact; }
    .container { display: block; }
    .product-panel, .cart-panel { width: 100%; }
    .btn-order, .qty-ctrl button, .btn-del, .modal-overlay { display: none !important; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>白事一条龙</h1>
  <div class="sub">—— 用心送别 · 体面周全 ——</div>
</div>

<!-- Main Content -->
<div class="container">
  <!-- Product Panel -->
  <div class="product-panel">
    <h2>商品列表</h2>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- Cart Panel -->
  <div class="cart-panel">
    <h2>
      订单清单
      <span class="count" id="cartCount">共 0 件</span>
    </h2>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty">暂无商品，请点击左侧商品添加</div>
    </div>
    <div class="cart-footer">
      <div class="total">
        <span>合计</span>
        <span class="num" id="cartTotal">¥0</span>
      </div>
      <button class="btn-order" id="btnOrder" disabled onclick="showOrderConfirm()">
        确认下单
      </button>
    </div>
  </div>
</div>

<!-- Remark Modal -->
<div class="modal-overlay" id="remarkModal" style="display:none" onclick="closeOnOverlay(event, 'remarkModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>填写备注信息</span>
      <button class="btn-close" onclick="closeRemark()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="product-info" id="remarkProductName"></div>
      <div class="form-group">
        <label>对死者的称呼 <span class="required">*</span></label>
        <input type="text" id="remarkDeceased" placeholder="例如：先父、先母、祖父、祖母……">
      </div>
      <div class="form-group">
        <label>晚辈有哪些人 <span class="required">*</span></label>
        <textarea id="remarkJuniors" rows="3" placeholder="例如：孝子 张三、孝女 李四、孝孙 王五……"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeRemark()">取消</button>
      <button class="btn-primary" onclick="confirmRemark()">确认添加</button>
    </div>
  </div>
</div>

<!-- Order Confirm Modal -->
<div class="modal-overlay" id="orderModal" style="display:none" onclick="closeOnOverlay(event, 'orderModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>确认订单</span>
      <button class="btn-close" onclick="closeOrder()">&times;</button>
    </div>
    <div class="modal-body" id="orderSummary"></div>
    <div class="modal-footer">
      <button onclick="closeOrder()">返回修改</button>
      <button class="btn-primary" onclick="submitOrder()">确认提交</button>
    </div>
  </div>
</div>

<script>
// ==================== Data ====================
const products = [
  { id: 1, name: '大花圈', icon: '🌸', price: 300, unit: '个', needsRemark: true },
  { id: 2, name: '小花圈', icon: '🌼', price: 150, unit: '个', needsRemark: true },
  { id: 3, name: '孝帐',   icon: '🏕️', price: 500, unit: '顶', needsRemark: true },
  { id: 4, name: '鞭炮',   icon: '🧨', price: 80,  unit: '挂', needsRemark: false },
  { id: 5, name: '大表纸', icon: '📜', price: 40,  unit: '刀', needsRemark: false },
];

// ==================== State ====================
let cart = [];              // { productId, qty, remark: { deceased, juniors } | null }
let pendingProduct = null;  // product being added (needs remark)

// ==================== Render Products ====================
function renderProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p => `
    <div class="product-card${p.needsRemark ? ' needs-remark' : ''}" onclick="addToCart(${p.id})">
      <div class="icon">${p.icon}</div>
      <div class="name">${p.name}</div>
      <div class="price">¥${p.price}</div>
      <div class="unit">/${p.unit}</div>
    </div>
  `).join('');
}

// ==================== Cart Operations ====================
function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;

  if (product.needsRemark) {
    pendingProduct = product;
    document.getElementById('remarkProductName').textContent =
      `正在添加：${product.name}（¥${product.price}/${product.unit}）`;
    document.getElementById('remarkDeceased').value = '';
    document.getElementById('remarkJuniors').value = '';
    document.getElementById('remarkModal').style.display = 'flex';
  } else {
    addToCartDirect(productId, null);
  }
}

function addToCartDirect(productId, remark) {
  const existing = cart.find(c => c.productId === productId && !c.remark === !remark);
  if (existing && !remark) {
    existing.qty++;
  } else {
    cart.push({ productId, qty: 1, remark: remark || null });
  }
  renderCart();
}

function confirmRemark() {
  const deceased = document.getElementById('remarkDeceased').value.trim();
  const juniors = document.getElementById('remarkJuniors').value.trim();

  if (!deceased || !juniors) {
    alert('请完整填写备注信息：对死者的称呼和晚辈有哪些人');
    return;
  }

  addToCartDirect(pendingProduct.id, { deceased, juniors });
  pendingProduct = null;
  document.getElementById('remarkModal').style.display = 'none';
}

function closeRemark() {
  pendingProduct = null;
  document.getElementById('remarkModal').style.display = 'none';
}

function changeQty(index, delta) {
  cart[index].qty += delta;
  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }
  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cartItems');
  const countEl = document.getElementById('cartCount');
  const totalEl = document.getElementById('cartTotal');
  const btn = document.getElementById('btnOrder');

  const totalItems = cart.reduce((s, c) => s + c.qty, 0);
  const totalPrice = cart.reduce((s, c) => {
    const p = products.find(p => p.id === c.productId);
    return s + (p ? p.price * c.qty : 0);
  }, 0);

  countEl.textContent = `共 ${totalItems} 件`;
  totalEl.textContent = `¥${totalPrice}`;
  btn.disabled = cart.length === 0;

  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">暂无商品，请点击左侧商品添加</div>';
    return;
  }

  container.innerHTML = cart.map((c, i) => {
    const p = products.find(p => p.id === c.productId);
    const name = p ? p.name : '未知';
    const price = p ? p.price : 0;
    const remarkText = c.remark
      ? `称呼：${c.remark.deceased}　晚辈：${c.remark.juniors}`
      : '';
    return `
      <div class="cart-item">
        <div class="qty-ctrl">
          <button onclick="changeQty(${i}, -1)">−</button>
          <span class="qty">${c.qty}</span>
          <button onclick="changeQty(${i}, 1)">+</button>
        </div>
        <div class="item-info">
          <div class="item-name">${name}</div>
          ${remarkText ? `<div class="item-remark" title="${escapeHtml(remarkText)}">${escapeHtml(remarkText)}</div>` : ''}
        </div>
        <div class="item-price">¥${price * c.qty}</div>
        <button class="btn-del" onclick="removeItem(${i})" title="删除">✕</button>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== Order Confirm ====================
function showOrderConfirm() {
  if (cart.length === 0) return;
  const totalPrice = cart.reduce((s, c) => {
    const p = products.find(p => p.id === c.productId);
    return s + (p ? p.price * c.qty : 0);
  }, 0);

  const rows = cart.map(c => {
    const p = products.find(p => p.id === c.productId);
    const name = p ? p.name : '未知';
    const price = p ? p.price : 0;
    const remarkHtml = c.remark
      ? `<br><span class="remark-cell">　↳ 称呼：${escapeHtml(c.remark.deceased)}，晚辈：${escapeHtml(c.remark.juniors)}</span>`
      : '';
    return `<tr>
      <td>${name} × ${c.qty}</td>
      <td style="text-align:right">¥${price * c.qty}</td>
    </tr>
    ${c.remark ? `<tr><td colspan="2" class="remark-cell">　↳ 称呼：${escapeHtml(c.remark.deceased)}，晚辈：${escapeHtml(c.remark.juniors)}</td></tr>` : ''}`;
  }).join('');

  document.getElementById('orderSummary').innerHTML = `
    <div class="order-summary">
      <table>
        ${rows}
        <tr class="total-row">
          <td>合计</td>
          <td style="text-align:right">¥${totalPrice}</td>
        </tr>
      </table>
    </div>
  `;
  document.getElementById('orderModal').style.display = 'flex';
}

function closeOrder() {
  document.getElementById('orderModal').style.display = 'none';
}

function submitOrder() {
  document.getElementById('orderModal').style.display = 'none';
  cart = [];
  renderCart();
  showToast('下单成功！订单已提交。');
}

// ==================== Toast ====================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// ==================== Modal Helpers ====================
function closeOnOverlay(e, modalId) {
  if (e.target === e.currentTarget) {
    document.getElementById(modalId).style.display = 'none';
    if (modalId === 'remarkModal') pendingProduct = null;
  }
}

// ==================== Init ====================
renderProducts();
renderCart();

// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
